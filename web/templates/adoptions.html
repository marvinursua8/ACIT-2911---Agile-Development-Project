<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoptions</title>
    <link href="{{ url_for('static', filename='styles/styles.css') }}" rel="stylesheet" />
</head>
<body>
    <h1>hello carlos</h1>
    <ul>
        {% for user in users %}
            <li>
                {{ user.first_name }} - {{ user.email }} 
                
                <!-- Add a form to send the POST request -->
                <form action="/adoptions" method="POST" style="display:inline;">

                    <!-- Pass the specific animal ID secretly -->
                    <input type="hidden" name="animal_id" value="1"> <!-- Replace '1' with your actual animal ID variable -->
                    
                    <!-- Give buttons names and values to identify what was clicked -->
                    <button type="submit" name="action" value="allow">Allow</button>
                    <button type="submit" name="action" value="deny">Deny</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
