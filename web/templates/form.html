<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adoption Form - Second-Look Adoption</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <link
      href="{{ url_for('static', filename='styles/styles.css') }}"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="logo">
        <a href="{{ url_for('home.index') }}">Second-Look Adoptions</a>
      </div>

      <nav class="nav-links">
        <a href="{{ url_for('home.index') }}">Home</a>
        <a href="{{ url_for('home.gallery') }}">Gallery</a>
        <a href="{{ url_for('home.adopt') }}">Adopt</a>
        <a href="{{ url_for('home.form') }}" class="active">Forms</a>
        <a href="{{ url_for('home.contact') }}">Contact</a>
      </nav>
    </header>

    <!-- MAIN -->
    <main>
      <!-- TITLE -->
      <section class="content-section">
        <h1>Contact Form</h1>
        <p>Please fill out the form below to contact us 🐾</p>
      </section>

      <hr class="divider" />

      <!-- FORM -->
      <section class="content-section">
        <div class="form-card">
          <!-- for (Flask/Supabase） -->
          <form onsubmit="handleSubmit(event)">
            <label>Name</label>
            <input type="text" name="name" required />

            <label>Email</label>
            <input type="email" name="email" required />

            <label>Phone</label>
            <input type="tel" name="phone" />

            <label>Reason</label>
            <select name="reason" required>
              <option value="">Select one</option>
              <option value="adoption">Adoption Inquiry</option>
              <option value="general">General Question</option>
              <option value="volunteer">Volunteer</option>
            </select>

            <label>Message</label>
            <textarea name="message" rows="5" required></textarea>

            <button type="submit" class="btn">Submit</button>
          </form>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <p>&copy; 2026 Second-Look Pet Adoption</p>
    </footer>

    <!-- JS -->
    <script>
      function handleSubmit(event) {
        event.preventDefault();
        alert("Form submitted successfully! 🎉");
      }
    </script>
  </body>
</html>
