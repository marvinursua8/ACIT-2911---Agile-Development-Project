{% extends "base.html" %}

{% block content %}
    <div id="error-page">
        <div>
            <h1>{{ code }} {{ name }}</h1>
            <p>An unexpected error occurred.</p>
        </div>
        <figure>
            <img src="{{ url_for('static', filename='graphics/cat.svg') }}" width="150" alt="Simple seafoam green cat icon" />
            <figcaption>Icon created by Stevanus from Noun Project</figcaption>
        </figure>
    </div>
{% endblock %}
