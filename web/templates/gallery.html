{% extends 'base.html' %}

{% block content %}
<main class="gallery-wrapper">
    <h1 class="gallery-title">Our Furry Friends</h1>
    
    <div class="filter-controls" style="margin-bottom: 20px;">
        <label for="animal-filter">Filter by Animal:</label>
        <select id="animal-filter">
            <option value="all">All Animals</option>
            {% for species in species_list %}
                <option value="{{ species|lower }}">{{ species|title }}s</option>
            {% endfor %}
        </select>
    </div>
    <div class="gallery-row">
    
        {% for animal in animals %}
        <div class="gallery-card" data-species="{{ animal.species|lower }}">
            
            <div class="card-image" 
                style="background-image: url('{{ animal.primary_image }}');">
                
                <div class="name-overlay">
                    <h2>{{ animal.name }}</h2>
                </div>
            </div>
            
            <div class="card-details">
                <div class="details-header">
                    <h3>{{ animal.name }}</h3>
                </div>
                <div class="details-body">
                    <p><strong>Breed:</strong> {{ animal.breed }}</p>
                    <p><strong>Gender:</strong> {{ animal.gender }}</p>
                </div>
            </div>
            <a class="inter-page-link" href="/pet/{{ animal.id }}"></a>
        </div>
        {% endfor %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Grab the dropdown menu and all the animal cards
            const filterSelect = document.getElementById('animal-filter');
            const cards = document.querySelectorAll('.gallery-card');
    
            // Listen for when the user changes the dropdown selection
            filterSelect.addEventListener('change', function() {
                // Get the value the user just clicked (e.g., 'dog', 'cat', 'all')
                const selectedAnimal = this.value.toLowerCase();
    
                // Loop through every single card on the page
                cards.forEach(card => {
                    // Read the invisible data-species tag we added in HTML
                    const cardSpecies = card.getAttribute('data-species');
    
                    // If 'all' is selected, OR if the card matches the selection -> show it
                    if (selectedAnimal === 'all' || cardSpecies === selectedAnimal) {
                        card.style.display = ''; // Show the card
                    } else {
                        card.style.display = 'none';  // Hide the card
                    }
                });
            });
        });
    </script>
</main>
{% endblock %}
