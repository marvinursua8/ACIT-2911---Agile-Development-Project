<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Second-Look Adoption</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="{{ url_for('static', filename='styles/styles.css') }}"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="logo">
        <a href="{{ url_for('home.index') }}">Second-Look Adoptions</a>
      </div>

      <nav class="nav-links">
        <a href="{{ url_for('home.index') }}">Home</a>
        <a href="{{ url_for('home.gallery') }}">Gallery</a>
        <a href="{{ url_for('home.adopt') }}">Adopt</a>
        <a href="{{ url_for('home.forms') }}">Forms</a>
        <a href="{{ url_for('home.contact') }}" class="active">Contact</a>
      </nav>
    </header>

    <!-- MAIN -->
    <main>
      <section class="content-section">
        <h1>Contact Us</h1>
        <p>Have questions about adoption? We're here to help 🐾</p>
      </section>

      <hr class="divider" />

      <section class="content-section">
        <h2>Get in Touch</h2>

        <div class="editable-content">
          <p>📧 Email: support@secondlook.com</p>
          <p>📞 Phone: (123) 456-7890</p>
          <p>📍 Location: Vancouver, BC</p>
        </div>
      </section>

      <!-- FORM -->
      <section class="content-section">
        <h3>Send us a message</h3>

        <form id="contactForm" class="contact-form">
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
          <textarea
            name="message"
            placeholder="Your Message"
            required
          ></textarea>

          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Second-Look Pet Adoption</p>
    </footer>

    <!-- AJAX SCRIPT -->
    <script>
      document
        .getElementById("contactForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault(); // ❗不刷新页面

          const formData = new FormData(this);

          const response = await fetch("/contact", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (data.status === "success") {
            showMessage(data.message);
            this.reset();
          }
        });

      function showMessage(msg) {
        const box = document.createElement("div");
        box.innerText = msg;

        box.style.position = "fixed";
        box.style.top = "20px";
        box.style.right = "20px";
        box.style.background = "green";
        box.style.color = "white";
        box.style.padding = "12px 16px";
        box.style.borderRadius = "8px";
        box.style.zIndex = "9999";

        document.body.appendChild(box);

        setTimeout(() => {
          box.remove();
        }, 2000);
      }
    </script>
  </body>
</html>
